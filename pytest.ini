[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=./ --cov-report=xml --cov-report=term --cov-fail-under=50 --cov-config=.coveragerc
norecursedirs = .git .cache venv .py_env
python_files = test_*.py
python_classes = Test
python_functions = test_*
asyncio_mode = auto

filterwarnings = 
    ignore::DeprecationWarning
